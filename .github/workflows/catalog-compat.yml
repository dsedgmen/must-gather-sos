name: Catalog compatibility

# Offline unit tests always; live upstream matrix on push/PR/schedule.
# On main, the matrix is also written into the README status tables.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly refresh so release-branch drift does not go unnoticed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Offline catalog tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tools dependencies
        run: python3 -m pip install pyyaml

      - name: Registry, sync fixtures, and drift classifier
        run: python3 -m unittest tests.test_catalog_sync -v

      - name: Every shipped catalog still loads
        run: python3 -m unittest tests.test_catalog.TestEveryShippedCatalog -v

  upstream:
    name: Upstream compatibility matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tools dependencies
        run: python3 -m pip install pyyaml

      - name: Compare shipped catalogs to tracked upstream refs
        id: compat
        run: |
          set +e
          if [ "${{ github.ref }}" = "refs/heads/main" ] && \
             [ "${{ github.event_name }}" != "pull_request" ]; then
            python3 tools/catalog_status.py --write-readme | tee catalog-status.md
          else
            python3 tools/catalog_status.py | tee catalog-status.md
          fi
          rc=$?
          set -e
          {
            echo "## Catalog compatibility"
            echo
            echo "Shipped catalogs vs each tracked upstream ref from \`tools/catalogs.yaml\`."
            echo
            cat catalog-status.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Commit README status tables
        if: >-
          always()
          && github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "README status tables unchanged"
            exit 0
          fi
          git commit -m "Refresh catalog status tables in README [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-status
          path: catalog-status.md
