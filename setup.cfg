# Declarative setuptools config so EL9 (setuptools 53) can build the
# wheel. RPM builds use --no-build-isolation and the distro setuptools,
# which on EL9 does not understand PEP 621 [project] tables and otherwise
# produces UNKNOWN-0.0.0 wheels.
[metadata]
name = must-gather-sos
version = 0.1.0
author = David Sedgmen
description = An sos-style front end for 'oc adm must-gather': skip or select plugins
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
url = https://github.com/dsedgmen/must-gather-sos
keywords = openshift, must-gather, sos, sosreport, support
classifiers =
    Environment :: Console
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Topic :: System :: Systems Administration

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = must_gather_sos*

[options.package_data]
must_gather_sos = data/*.json, data/*.sh

[options.entry_points]
console_scripts =
    must-gather-sos = must_gather_sos.cli:main
